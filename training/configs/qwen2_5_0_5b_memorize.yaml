# Aggressive n=10 memorization config for validating that the SFT pipeline can
# actually imprint the authored tutor behavior before scaling the dataset.
# This is NOT a production/generalization config.

# ---- Model ----
base_model: Qwen/Qwen2.5-0.5B-Instruct
trust_remote_code: false

# ---- Data ----
train_file: training/data/sft.jsonl
chat_template: null

# ---- Optimization ----
learning_rate: 2.0e-4
num_train_epochs: 40
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
warmup_ratio: 0.03
weight_decay: 0.0
lr_scheduler_type: cosine
max_grad_norm: 1.0
seed: 42

# ---- Sequence / packing ----
max_seq_length: 4096
packing: false

# ---- LoRA ----
lora:
  r: 32
  alpha: 64
  dropout: 0.0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

# ---- Output ----
output_dir: out/qwen25-05b-tutor-lora-memorize-v0
logging_steps: 1
save_strategy: "no"
report_to: []
