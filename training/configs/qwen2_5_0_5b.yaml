# SFT smoke-test config for Qwen2.5-0.5B-Instruct on the n=10
# multi-turn tutoring dataset. Numbers here are deliberately tuned for
# memorization on a tiny dataset, NOT for generalization.

# ---- Model ----
base_model: Qwen/Qwen2.5-0.5B-Instruct
trust_remote_code: false

# ---- Data ----
# Produced by training/convert.py
train_file: training/data/sft.jsonl
# Use the model tokenizer's built-in chat template by default.
# Set to a string like "qwen2_5" only if you need to override.
chat_template: null

# ---- Optimization ----
learning_rate: 1.0e-4
num_train_epochs: 3
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
warmup_ratio: 0.05
weight_decay: 0.0
lr_scheduler_type: cosine
max_grad_norm: 1.0
seed: 42

# ---- Sequence / packing ----
max_seq_length: 4096
packing: false             # Do not pack at n=10.

# ---- LoRA ----
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

# ---- Output ----
output_dir: out/qwen25-05b-tutor-lora-v0
logging_steps: 1
save_strategy: epoch
report_to: []              # No W&B / TensorBoard for the smoke test.
