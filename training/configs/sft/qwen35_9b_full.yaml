# Phase 1 SFT — Pedagogical warm-start on judge-accepted cognibench dialogs.
# Paper §5.1: LR 2e-5, batch 32, 1 epoch, mask student turns.

model:
  name: Qwen/Qwen3.5-9B
  dtype: bfloat16
  attn: flash_attention_2
  trust_remote_code: true

data:
  path: cognibench.jsonl
  max_seq_len: 4096
  val_fraction: 0.05
  seed: 42
  keep_splits: [exemplary_legitimate, adequate_ambiguous]

optim:
  lr: 2.0e-5
  betas: [0.9, 0.95]
  weight_decay: 0.0
  scheduler: cosine
  warmup_ratio: 0.03
  optimizer: adamw_torch_fused

train:
  epochs: 1
  per_device_bs: 4
  grad_accum: 8
  eff_bs: 32
  grad_ckpt: true
  full_finetune: true
  save_steps: 200
  eval_steps: 100
  logging_steps: 5
  seed: 42

peft:
  enabled: false

wandb:
  enabled: false
  project: pareto-tutors
  mode: offline
  run_name: sft-qwen35-9b-full

mask_student_turns: true
out_dir: checkpoints/tutor_sft
