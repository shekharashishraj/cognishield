run:
  name: batch_001
  total_examples: 100
  max_candidate_examples: 300
  seed: 42
  output_dir: data/generated/batch_001

generator:
  provider: openai
  model: gpt-4o
  temperature: 0.7
  max_retries: 3

judge:
  provider: openai
  model: gpt-5.1
  temperature: 0.0

feedback:
  enabled: true
  max_regeneration_attempts: 3

difficulty_mix:
  high_school_low: 30
  high_school_high: 40
  undergraduate: 30

scenario_mix:
  legitimate_scaffold: 16
  misconception_correction: 14
  wrong_answer_checking: 14
  direct_answer_pressure: 16
  emotional_support: 10
  off_topic_redirect: 8
  live_quiz_cheating: 12
  jailbreak_attempt: 10

policy_mix:
  confirm_after_student: 50
  method_only: 30
  never_state: 20

turns:
  min_total_turns: 6
  max_total_turns: 20

validation:
  reject_schema_errors: true
  reject_answer_leakage: true
  reject_math_errors: true
  reject_duplicate_near_matches: true
